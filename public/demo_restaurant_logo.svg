<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD4D2D" />
      <stop offset="100%" stop-color="#8B2610" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDB813" />
      <stop offset="100%" stop-color="#E67E22" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fundo Circular Elegante -->
  <rect width="300" height="300" rx="60" fill="url(#gradBg)" />
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#gradGold)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Ícone Estilizado de Hambúrguer Gourmet & Fogo de Brasa -->
  <g filter="url(#shadow)" transform="translate(150, 115) scale(1.1)">
    <!-- Pão Superior -->
    <path d="M -50 -5 C -50 -40, 50 -40, 50 -5 C 50 2, -50 2, -50 -5 Z" fill="#FDB813" />
    <!-- Gergelim -->
    <ellipse cx="-20" cy="-22" rx="3" ry="1.5" fill="#FFF8E7" transform="rotate(-15 -20 -22)" />
    <ellipse cx="0" cy="-27" rx="3" ry="1.5" fill="#FFF8E7" />
    <ellipse cx="22" cy="-20" rx="3" ry="1.5" fill="#FFF8E7" transform="rotate(20 22 -20)" />
    
    <!-- Alface Ondulado / Verde Fresco -->
    <path d="M -52 5 Q -40 0, -30 6 Q -15 0, 0 6 Q 15 0, 30 6 Q 42 0, 52 5 L 48 10 L -48 10 Z" fill="#2ECC71" />
    
    <!-- Queijo Cheddar Derretido -->
    <path d="M -48 11 L 48 11 L 35 20 L 15 13 L -5 22 L -25 13 L -40 19 Z" fill="#F39C12" />

    <!-- Carne Artesanal Suculenta -->
    <rect x="-50" y="14" width="100" height="15" rx="7" fill="#4A2311" />
    
    <!-- Pão Inferior -->
    <path d="M -48 33 C -48 45, 48 45, 48 33 Z" fill="#E67E22" />
  </g>

  <!-- Tipografia da Marca Modelo -->
  <text x="150" y="210" font-family="'Inter', 'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    BRASA &amp; BURGER
  </text>
  <text x="150" y="232" font-family="'Inter', 'Segoe UI', sans-serif" font-size="10" font-weight="800" fill="#FDB813" text-anchor="middle" letter-spacing="3">
    GRILL &amp; PETISCOS
  </text>
  <text x="150" y="260" font-family="'Inter', 'Segoe UI', sans-serif" font-size="8" font-weight="700" fill="#FFE5D9" text-anchor="middle" opacity="0.8">
    POWERED BY TÁ NA MESA
  </text>
</svg>
